<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>United States of Kadria | Interactive Map</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Tahoma', sans-serif; background: #000; overflow: hidden; touch-action: none; }
        #globeViz { width: 100vw; height: 100vh; }
        #info {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(212, 175, 55, 0.95); color: #fff;
            padding: 12px 26px; border-radius: 12px;
            font-weight: 700; font-size: 16px; z-index: 100;
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.5);
            display: none; transition: 0.3s;
            white-space: nowrap;
        }
        #loading {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #d4af37; font-size: 18px; font-weight: 700; z-index: 200;
        }
    </style>
</head>
<body>
    <div id="globeViz"></div>
    <div id="info"></div>
    <div id="loading">Loading map...</div>

    <script src="https://unpkg.com/globe.gl"></script>

    <script>
        // ============================================
        // ۱. کشورهای نمایش داده شده
        // ============================================
        const visibleCountries = {
            "United States of America": {
                name: "United States of Kadria",
                color: "#d4af37"
            },
            "Canada": {
                name: "Hekmatestan",
                color: "#4a90e2"
            },
            "Mexico": {
                name: "Javanestan",
                color: "#e74c3c"
            },
            "Russia": {
                name: "Ghahremanland",
                color: "#27ae60"
            }
        };

        // ============================================
        // ۲. لیبل‌های دریاها و خلیج‌ها
        // ============================================
        const waterLabels = [
            {
                lat: 25,
                lng: -90,
                name: "Kadrian Gulf",
                color: "#5dade2"
            }
        ];

        // ============================================
        // ۳. لینک GeoJSON
        // ============================================
        const geoJsonUrl = "https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_0_countries.geojson";

        // ============================================
        // ۴. ساخت کره
        // ============================================
        const world = Globe()
            (document.getElementById('globeViz'))
            .globeImageUrl('//unpkg.com/three-globe/example/img/earth-dark.jpg')
            .bumpImageUrl('//unpkg.com/three-globe/example/img/earth-topology.png')
            .backgroundColor('#000010')
            .showAtmosphere(true)
            .atmosphereColor('#d4af37')
            .atmosphereAltitude(0.15)

            // --- کشورها ---
            .polygonAltitude(feat => {
                const realName = feat.properties.ADMIN || feat.properties.NAME;
                return visibleCountries[realName] ? 0.015 : 0;
            })
            .polygonCapColor(feat => {
                const realName = feat.properties.ADMIN || feat.properties.NAME;
                return visibleCountries[realName] ? visibleCountries[realName].color : 'rgba(0,0,0,0)';
            })
            .polygonSideColor(feat => {
                const realName = feat.properties.ADMIN || feat.properties.NAME;
                return visibleCountries[realName] ? 'rgba(212, 175, 55, 0.4)' : 'rgba(0,0,0,0)';
            })
            .polygonStrokeColor(feat => {
                const realName = feat.properties.ADMIN || feat.properties.NAME;
                return visibleCountries[realName] ? '#ffffff' : 'rgba(0,0,0,0)';
            })
            .polygonLabel(feat => {
                const realName = feat.properties.ADMIN || feat.properties.NAME;
                if (!visibleCountries[realName]) return '';
                return `
                    <div style="background: rgba(0,0,0,0.9); color: #fff; padding: 10px 18px; border-radius: 10px; font-family: Tahoma; border: 1px solid ${visibleCountries[realName].color};">
                        <b style="color: ${visibleCountries[realName].color}; font-size: 16px;">${visibleCountries[realName].name}</b>
                    </div>
                `;
            })
            .onPolygonHover(feat => {
                const realName = feat ? (feat.properties.ADMIN || feat.properties.NAME) : null;
                world.polygonAltitude(f => {
                    const n = f.properties.ADMIN || f.properties.NAME;
                    if (feat && n === realName && visibleCountries[n]) return 0.05;
                    return visibleCountries[n] ? 0.015 : 0;
                });
            })
            .onPolygonClick(feat => {
                const realName = feat.properties.ADMIN || feat.properties.NAME;
                if (!visibleCountries[realName]) return;
                showInfo(`📍 ${visibleCountries[realName].name}`);
            })

            // --- لیبل‌های دریاها ---
            .labelsData(waterLabels)
            .labelLat(d => d.lat)
            .labelLng(d => d.lng)
            .labelText(d => d.name)
            .labelSize(d => 0.8)
            .labelDotRadius(d => 0.3)
            .labelColor(d => d.color)
            .labelResolution(2)
            .labelAltitude(0.005)
            .onLabelClick(d => {
                showInfo(`🌊 ${d.name}`);
            })
            .labelLabel(d => `
                <div style="background: rgba(0,0,0,0.85); color: ${d.color}; padding: 8px 16px; border-radius: 10px; font-family: Tahoma; border: 1px solid ${d.color};">
                    <b style="font-size: 15px;">${d.name}</b>
                </div>
            `);

        // ============================================
        // ۵. تابع نمایش اطلاعات
        // ============================================
        function showInfo(text) {
            const info = document.getElementById('info');
            info.innerHTML = text;
            info.style.display = 'block';
            clearTimeout(window.infoTimeout);
            window.infoTimeout = setTimeout(() => { info.style.display = 'none'; }, 3000);
        }

        // ============================================
        // ۶. بارگذاری GeoJSON
        // ============================================
        fetch(geoJsonUrl)
            .then(res => res.json())
            .then(countries => {
                world.polygonsData(countries.features);
                document.getElementById('loading').style.display = 'none';
            })
            .catch(err => {
                console.error("Error loading map:", err);
                document.getElementById('loading').innerText = "❌ Failed to load map";
            });

        // ============================================
        // ۷. چرخش و زوم
        // ============================================
        world.controls().autoRotate = true;
        world.controls().autoRotateSpeed = 0.4;
        world.controls().enableZoom = true;
        world.controls().enablePan = false;
        world.controls().minDistance = 180;
        world.controls().maxDistance = 700;

        document.addEventListener('touchstart', () => {
            world.controls().autoRotate = false;
        }, { passive: true });

        // ============================================
        // ۸. ریسپانسیو
        // ============================================
        window.addEventListener('resize', () => {
            world.width(window.innerWidth);
            world.height(window.innerHeight);
        });

        // شروع از زاویه‌ی آمریکای شمالی
        world.pointOfView({ lat: 45, lng: -100, altitude: 2 }, 2000);
    </script>
</body>
</html>
